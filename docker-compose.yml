services:

  # =========================================================
  # TRINO
  # =========================================================

  trino:
    image: trinodb/trino:483
    container_name: qlore-trino

    ports:
      - "8081:8080"

    volumes:
      - ./trino/etc:/etc/trino
      - qlore-trino-data:/data/trino

    depends_on:
      iceberg-rest:
        condition: service_started

      minio:
        condition: service_started

      qlore-postgres:
        condition: service_healthy

    networks:
      - qlore-network


  # =========================================================
  # KAFKA
  # =========================================================

  kafka:
    image: apache/kafka:4.3.1
    container_name: qlore-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT_HOST://:9092,
        PLAINTEXT_INTERNAL://:29092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - qlore-kafka-data:/var/lib/kafka/data

    networks:
      - qlore-network


  # =========================================================
  # MINIO
  # =========================================================

  minio:
    image: minio/minio:latest
    container_name: qlore-minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio

    volumes:
      - qlore-minio-data:/data

    networks:
      qlore-network:
        aliases:
          - warehouse.minio


  # =========================================================
  # ICEBERG REST
  # =========================================================

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: qlore-iceberg-rest

    ports:
      - "8181:8181"

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1

      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE_ACCESS: "true"

    depends_on:
      - minio

    volumes:
      - qlore-iceberg-catalog:/tmp

    networks:
      - qlore-network


  # =========================================================
  # QLORE POSTGRESQL
  # =========================================================

  qlore-postgres:
    image: postgres:16
    container_name: qlore-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: qlore
      POSTGRES_PASSWORD: qlore
      POSTGRES_DB: qlore

    volumes:
      - qlore-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U qlore -d qlore
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - qlore-network


  # =========================================================
  # AIRFLOW DATABASE
  # =========================================================

  airflow-db:
    image: postgres:16
    container_name: qlore-airflow-db

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - qlore-airflow-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - qlore-network


  # =========================================================
  # AIRFLOW INIT
  # =========================================================

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: qlore-airflow:3.3.1
    container_name: qlore-airflow-init

    depends_on:
      airflow-db:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: qlore-local-development-secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

      PYTHONPATH: /opt/airflow/qlore

      QLORE_CATALOG_URI: http://iceberg-rest:8181
      QLORE_S3_ENDPOINT: http://minio:9000

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/qlore

    command: db migrate

    networks:
      - qlore-network


  # =========================================================
  # AIRFLOW API SERVER
  # =========================================================

  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: qlore-airflow:3.3.1
    container_name: qlore-airflow-apiserver

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: qlore-local-development-secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

      PYTHONPATH: /opt/airflow/qlore

      QLORE_CATALOG_URI: http://iceberg-rest:8181
      QLORE_S3_ENDPOINT: http://minio:9000

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/qlore

    command: api-server

    networks:
      - qlore-network


  # =========================================================
  # AIRFLOW SCHEDULER
  # =========================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: qlore-airflow:3.3.1
    container_name: qlore-airflow-scheduler

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: qlore-local-development-secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

      PYTHONPATH: /opt/airflow/qlore

      QLORE_CATALOG_URI: http://iceberg-rest:8181
      QLORE_S3_ENDPOINT: http://minio:9000

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/qlore

    command: scheduler

    networks:
      - qlore-network


  # =========================================================
  # AIRFLOW DAG PROCESSOR
  # =========================================================

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: qlore-airflow:3.3.1
    container_name: qlore-airflow-dag-processor

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: qlore-local-development-secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

      PYTHONPATH: /opt/airflow/qlore

      QLORE_CATALOG_URI: http://iceberg-rest:8181
      QLORE_S3_ENDPOINT: http://minio:9000

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/qlore

    command: dag-processor

    networks:
      - qlore-network


# ===========================================================
# VOLUMES
# ===========================================================

volumes:

  qlore-kafka-data:

  qlore-minio-data:

  qlore-iceberg-catalog:

  qlore-airflow-db-data:

  qlore-trino-data:

  qlore-postgres-data:


# ===========================================================
# NETWORK
# ===========================================================

networks:

  qlore-network: